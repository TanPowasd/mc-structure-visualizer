[package]
name = "mcvis-desktop"
version = "0.1.0"
description = "Universal Multi-Version (1.20.1 / 1.21.11) & Multi-Loader Minecraft Structure Visualizer"
authors = ["MC Structure Visualizer Contributors"]
edition = "2021"

[lib]
name = "mcvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rayon = "1.10"
ureq = { version = "2.12", features = ["json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
